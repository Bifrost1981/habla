# Pflichtprüfung für jeden Pull Request und jeden Stand auf main (WP-13).
# Grün nur, wenn die Startprüfung (Nachweise passen zum Stand) UND alle Tests tatsächlich bestehen.
# Damit genügt ein von Hand umgeschriebener Nachweis nicht mehr (Defekt G2): die Tests laufen hier neu.
name: Prüfung

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruefung-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefung:
    name: Startprüfung und Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Nachweise sind an die Node-Hauptversion gebunden
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pakete
        run: npm ci

      - name: Browser für die Browser-Tests
        run: npx playwright install --with-deps chromium

      - name: Startprüfung (Nachweise passen zum Stand, keine Defekte)
        run: python3 scripts/project_gate.py start

      - name: Selbsttest des Prüfskripts
        run: python3 -m unittest discover -s tests/gate

      - name: Logik, Typen, Build
        run: |
          npm test
          npx tsc --noEmit
          npm run build

      - name: Inhalte und Lernlogik
        run: |
          npm run test:mix
          npm run test:feedback
          npm run test:assessment
          npm run test:srs
          npm run test:stories
          node --experimental-strip-types --no-warnings scripts/test-roleplay.ts
          node --experimental-strip-types --no-warnings scripts/test-frequency.ts
          node --experimental-strip-types --no-warnings scripts/test-links.ts

      - name: Vertonung (nur Textliste; die Aufnahmen liegen nicht im Repository)
        run: npm run test:audio -- --texts-only

      - name: Browser-Tests
        run: npm run e2e

      - name: Auslieferung (Unterpfad, offline)
        run: npx playwright test -c tests/delivery/playwright.config.ts

      - name: Gegenprobe der Browser-Tests (Verfälschungen müssen auffallen)
        run: python3 -B scripts/e2e_mutation_check.py

      - name: Testergebnisse bei Fehlern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testergebnisse
          path: test-results/
          retention-days: 7
