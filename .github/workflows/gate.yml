# Pflichtprüfung für Pull Requests. Wirkt erst, wenn das Projekt in einem GitHub-Repository liegt
# UND die Regel „Require status checks to pass“ für main diesen Job verlangt (Paket WP-13).
name: gate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Startprüfung (Projektdateien, Featureliste, gültige Nachweise, Smoke-Tests)
        run: python3 scripts/project_gate.py start
      - name: Selbsttest der Prüflogik
        run: python3 -m unittest discover -s tests/gate
      - name: Build
        run: npm run build
